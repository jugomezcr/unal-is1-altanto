# Configuración SOLO para las pruebas (./mvnw test). Reemplaza la de src/main/resources.

spring.application.name=altanto-test

# Base H2 en memoria: se crea limpia en cada corrida y no toca ./data/ de la app real.
# DB_CLOSE_DELAY=-1: la base vive mientras dure la JVM de pruebas (no se borra entre conexiones).
spring.datasource.url=jdbc:h2:mem:altanto-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Igual que la app: cargar schema.sql + data.sql y solo validar las entidades.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate

# La consola web no hace falta en pruebas.
spring.h2.console.enabled=false
