<!DOCTYPE html>
<!--
  CU-01-HU-02: Ver las diferencias y confirmar.
  La pinta ConciliacionController (GET /conciliacion/{id}). Datos del Model:
   - conciliacion : la cabecera (fecha, total Z, estado).
   - detalles     : una línea por artículo.
   - mensaje / error : llegan solo después de confirmar (flash attributes).
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Diferencias')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main>
    <h1>Conciliación del <span th:text="${conciliacion.fechaConciliacion}">2026-11-03</span></h1>
    <p>
        Ventas del reporte Z: $<span th:text="${conciliacion.totalVentaReporteZ}">0</span>
        · Estado: <strong th:text="${conciliacion.estado}">BORRADOR</strong>
    </p>

    <p class="ok" th:if="${mensaje}" th:text="${mensaje}">Mensaje</p>
    <p class="error" th:if="${error}" th:text="${error}">Error</p>

    <table>
        <tr>
            <th>Artículo</th>
            <th>Existencia anterior</th>
            <th>− Vendido</th>
            <th>= Esperado</th>
            <th>Contado</th>
            <th>Diferencia</th>
        </tr>
        <!-- th:classappend agrega la clase "diferencia" (fondo rojo) si el artículo no cuadra -->
        <tr th:each="d : ${detalles}" th:classappend="${d.tieneDiferencia()} ? 'diferencia'">
            <td th:text="${d.articulo.nombre}">Harina</td>
            <td th:text="${d.existenciaAnterior}">15</td>
            <td th:text="${d.cantidadSalida}">0</td>
            <td th:text="${d.existenciaEsperada}">15</td>
            <td th:text="${d.cantidadContada}">14</td>
            <td th:text="${d.diferencia}">-1</td>
        </tr>
    </table>
    <p>Diferencia = contado − esperado. Negativa: falta mercancía. Positiva: sobra.</p>

    <!-- El botón solo aparece mientras sea borrador -->
    <form th:if="${conciliacion.esBorrador()}"
          th:action="@{/conciliacion/{id}/confirmar(id=${conciliacion.id})}" method="post">
        <button type="submit">Confirmar conciliación</button>
    </form>

    <p><a th:href="@{/conciliacion/historial}">Ver cierres anteriores</a></p>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
