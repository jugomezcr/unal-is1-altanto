<!DOCTYPE html>
<!--
  CU-01-HU-02: Consultar cierres previos.
  La pinta ConciliacionController (GET /conciliacion/historial).
  Model: cierres = lista de ConciliacionDiaria, la más reciente primero.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cierres anteriores')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main>
    <h1>Cierres anteriores</h1>
    <p><a th:href="@{/conciliacion}">Conciliar el día</a></p>

    <table>
        <tr>
            <th>Fecha</th>
            <th>Ventas reporte Z</th>
            <th>Estado</th>
            <th></th>
        </tr>
        <tr th:each="c : ${cierres}">
            <td th:text="${c.fechaConciliacion}">2026-11-01</td>
            <td th:text="${c.totalVentaReporteZ}">345000.00</td>
            <td th:text="${c.estado}">CONFIRMADA</td>
            <!-- @{/conciliacion/{id}(id=...)} arma la URL /conciliacion/5 -->
            <td><a th:href="@{/conciliacion/{id}(id=${c.id})}">Ver diferencias</a></td>
        </tr>
    </table>
    <p th:if="${cierres.isEmpty()}">Todavía no hay conciliaciones.</p>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
