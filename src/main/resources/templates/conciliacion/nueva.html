<!DOCTYPE html>
<!--
  CU-01-HU-01: Digitar lo vendido y lo contado del día.
  La pinta ConciliacionController (GET y POST /conciliacion). Datos del Model:
   - form        : ConciliacionForm (fecha, total y una línea por artículo).
   - error       : mensaje de una regla de negocio (fecha futura o duplicada).
   - existenteId : id de la conciliación que ya existe para esa fecha.

  Cómo viajan los datos: cada <input name="..."> llama al setter con ese nombre.
  name="lineas[0].contado" → form.getLineas().get(0).setContado(...).
  th:name / th:value arman el name y el value con Thymeleaf (|...| = texto con variables).
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Conciliar el día')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main>
    <h1>Conciliar el día</h1>
    <p><a th:href="@{/conciliacion/historial}">Ver cierres anteriores</a></p>

    <!-- th:if: la etiqueta solo se pinta si la condición es verdadera -->
    <p class="error" th:if="${error}" th:text="${error}">Error</p>
    <p th:if="${existenteId}">
        <a th:href="@{/conciliacion/{id}(id=${existenteId})}">Ver la conciliación existente</a>
    </p>

    <!-- th:object: el formulario trabaja sobre ${form}. #fields revisa sus errores de validación. -->
    <form th:action="@{/conciliacion}" th:object="${form}" method="post">
        <p class="error" th:if="${#fields.hasErrors('*')}">
            Revise el formulario: la fecha, el total y lo contado son obligatorios y no pueden ser negativos.
        </p>

        <p>
            <label>Fecha <input type="date" name="fecha" th:value="${form.fecha}"></label>
        </p>
        <p>
            <label>Total de ventas del reporte Z ($)
                <input type="number" step="0.01" min="0" name="totalVentasZ" th:value="${form.totalVentasZ}">
            </label>
        </p>

        <table>
            <tr>
                <th>Artículo</th>
                <th>Unidad</th>
                <th>Vendido (reporte Z)</th>
                <th>Contado</th>
            </tr>
            <!-- th:each repite la fila por cada línea; i.index es la posición (0, 1, 2...) -->
            <tr th:each="linea, i : ${form.lineas}">
                <td>
                    <span th:text="${linea.nombre}">Harina</span>
                    <!-- Campos ocultos: si hay un error, la fila se vuelve a pintar con estos datos -->
                    <input type="hidden" th:name="|lineas[${i.index}].articuloId|" th:value="${linea.articuloId}">
                    <input type="hidden" th:name="|lineas[${i.index}].nombre|" th:value="${linea.nombre}">
                    <input type="hidden" th:name="|lineas[${i.index}].unidadMedida|" th:value="${linea.unidadMedida}">
                    <input type="hidden" th:name="|lineas[${i.index}].tipoArticulo|" th:value="${linea.tipoArticulo}">
                </td>
                <td th:text="${linea.unidadMedida}">KILOGRAMO</td>
                <td>
                    <!-- Solo los productos de reventa se venden; los insumos no -->
                    <input th:if="${linea.esReventa()}" type="number" step="0.001" min="0"
                           th:name="|lineas[${i.index}].vendido|" th:value="${linea.vendido}">
                </td>
                <td>
                    <input type="number" step="0.001" min="0"
                           th:name="|lineas[${i.index}].contado|" th:value="${linea.contado}">
                </td>
            </tr>
        </table>

        <button type="submit">Guardar y ver diferencias</button>
        <a th:href="@{/}">Cancelar</a>
    </form>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
