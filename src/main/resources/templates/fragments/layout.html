<!DOCTYPE html>
<!--
  Piezas comunes a todas las páginas (como un "base.html" de Jinja/Django).
  Esta página no se muestra sola: las demás toman sus fragmentos con
  th:replace="~{fragments/layout :: nombre}".
   - head(titulo): <head> con el título y la hoja de estilos.
   - navbar:       menú.
   - footer:       pie de página.
  th:fragment="..." declara un fragmento. @{/ruta} arma una URL de la aplicación.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <title th:text="${titulo} + ' · Al-Tanto'">Al-Tanto</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>

<header th:fragment="navbar">
    <strong>Al-Tanto</strong> · Panadería Leonardo Betancur
    <nav>
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/conciliacion}">Conciliación (CU-01)</a>
        <a th:href="@{/inventario/alertas}">Alertas (CU-02)</a>
        <a th:href="@{/produccion/tandas}">Producción (CU-03)</a>
        <a th:href="@{/h2-console}">Base de datos (H2)</a>
    </nav>
</header>

<footer th:fragment="footer">
    Ingeniería de Software I · Equipo Hefesto (Grupo 4) · UNAL 2026-II
</footer>

</body>
</html>
