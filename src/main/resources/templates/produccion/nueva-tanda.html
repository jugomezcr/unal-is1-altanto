<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registro de Tanda · Al-Tanto')}">
    <meta charset="UTF-8">
    <title>Registro de Tanda</title>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen flex flex-col font-sans">
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <h1 class="text-2xl font-bold text-stone-900 mb-4">CU-03: Registrar Tanda de Producción</h1>
        <p class="text-stone-600 mb-6">Registro de harina base (bulto 50 kg), unidades obtenidas e insumos gastados.</p>

        <!-- Banner de error de negocio (paso 4a del CU-03) -->
        <div th:if="${error != null}" role="alert" aria-live="assertive"
             class="mb-4 p-4 rounded-lg bg-rose-50 border border-rose-200 text-rose-800"
             th:text="${error}">Error</div>

        <!-- Banner de éxito -->
        <div th:if="${success != null}"
             class="mb-4 p-4 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800"
             th:text="${success}">Tanda registrada correctamente.</div>

        <form th:action="@{/produccion/tandas}" th:object="${tandaForm}" method="post"
              class="bg-white p-6 rounded-xl border border-stone-200 shadow-sm space-y-6">

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <label class="block">
                    <span class="text-sm font-semibold text-stone-700">Fecha de producción</span>
                    <input type="date" th:field="*{fecha}"
                           class="mt-1 w-full text-lg px-3 py-3 rounded-lg border border-stone-300 focus:ring-2 focus:ring-amber-600">
                    <span th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}" class="block mt-1 text-sm text-rose-700"></span>
                </label>
                <label class="block">
                    <span class="text-sm font-semibold text-stone-700">Producto elaborado</span>
                    <select th:field="*{productoId}"
                            class="mt-1 w-full text-lg px-3 py-2 rounded-lg border border-stone-300 focus:ring-2 focus:ring-amber-600">
                        <option value="" disabled>Seleccione un producto</option>
                        <option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.nombre}"></option>
                    </select>
                    <span th:if="${#fields.hasErrors('productoId')}" th:errors="*{productoId}" class="block mt-1 text-sm text-rose-700"></span>
                </label>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <label class="block">
                    <span class="text-sm font-semibold text-stone-700">Harina base (kg)</span>
                    <input type="number" step="0.01" min="0" inputmode="decimal" th:field="*{harinaBaseKg}"
                           class="mt-1 w-full text-lg px-3 py-3 rounded-lg border border-stone-300 focus:ring-2 focus:ring-amber-600">
                    <span th:if="${#fields.hasErrors('harinaBaseKg')}" th:errors="*{harinaBaseKg}" class="block mt-1 text-sm text-rose-700"></span>
                </label>
                <label class="block">
                    <span class="text-sm font-semibold text-stone-700">Unidades obtenidas</span>
                    <input type="number" step="1" min="0" inputmode="decimal" th:field="*{unidadesObtenidas}"
                           class="mt-1 w-full text-lg px-3 py-3 rounded-lg border border-stone-300 focus:ring-2 focus:ring-amber-600">
                    <span th:if="${#fields.hasErrors('unidadesObtenidas')}" th:errors="*{unidadesObtenidas}" class="block mt-1 text-sm text-rose-700"></span>
                </label>
            </div>

            <label class="block">
                <span class="text-sm font-semibold text-stone-700 flex items-baseline gap-1">Maestro panadero <span class="text-rose-600" aria-hidden="true">(obligatorio)</span></span>
                <input type="text" th:field="*{maestroPanadero}" required
                       class="mt-1 w-full text-lg px-3 py-3 rounded-lg border border-stone-300 focus:ring-2 focus:ring-amber-600">
                <span th:if="${#fields.hasErrors('maestroPanadero')}" th:errors="*{maestroPanadero}" class="block mt-1 text-sm text-rose-700"></span>
            </label>

            <label class="block">
                <span class="text-sm font-semibold text-stone-700">Observaciones</span>
                <textarea th:field="*{observaciones}" rows="3"
                          class="mt-1 w-full text-lg px-3 py-3 rounded-lg border border-stone-300 focus:ring-2 focus:ring-amber-600"></textarea>
                <span class="block mt-1 text-xs text-stone-500">Opcional</span>
            </label>

            <!-- Insumos consumidos (filas dinámicas; name alineados por posición) -->
            <div class="border border-stone-200 rounded-lg p-4">
                <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
                    <h2 class="text-sm font-semibold text-stone-700">Insumos consumidos</h2>
                    <button type="button" id="addInsumo" class="text-sm font-semibold text-amber-700 hover:underline">+ Agregar insumo</button>
                </div>
                <div id="insumosList" aria-label="Filas de insumos de la tanda">
                    <table class="w-full text-left text-sm divide-y divide-stone-100">
                        <thead class="text-xs uppercase text-stone-500">
                            <tr>
                                <th class="py-3 pr-4 text-left">Insumo</th>
                                <th class="py-3 pr-4 text-left">Existencia disponible</th>
                                <th class="py-3 pr-4 text-left">Cantidad (kg)</th>
                                <th class="py-3"></th>
                            </tr>
                        </thead>
                        <tbody id="insumosBody">
                            <!-- Filas pre-renderizadas si el formulario vuelve con errores de validación -->
                            <tr th:if="${!#lists.isEmpty(tandaForm.insumoIds)}" th:each="_, stat : ${tandaForm.insumoIds}"
                                class="insumo-row border-b border-stone-100 last:border-0">
                                <td class="py-3 pr-4">
                                    <select name="insumoIds" class="w-full text-lg px-3 py-2 rounded-lg border border-stone-300 focus:ring-2 focus:ring-amber-600" required>
                                        <option value="" disabled>Seleccione insumo</option>
                                        <option th:each="ins : ${insumos}" th:value="${ins.id}"
                                                th:selected="${ins.id == __${stat.value}__}"
                                                th:text="${ins.nombre}"
                                                data-existencia="${ins.getExistenciaActual()}"></option>
                                    </select>
                                    <span class="hint-existencia block mt-1 text-xs text-stone-500"></span>
                                </td>
                                <td class="py-3 pr-4">
                                    <input name="cantidades" type="number" step="0.001" min="0" inputmode="decimal" required
                                           th:value="${tandaForm.cantidades[__${stat.index}__]}"
                                           class="w-full text-lg px-3 py-2 rounded-lg border border-stone-300 focus:ring-2 focus:ring-amber-600">
                                </td>
                                <td class="py-3">
                                    <button type="button" class="remover text-rose-600 hover:text-rose-800 font-mono text-xl leading-none" aria-label="Quitar insumo de la fila">&times;</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <p id="msgVacio" th:if="${#lists.isEmpty(tandaForm.insumoIds)}" class="text-stone-400 text-sm py-4">No hay insumos agregados.</p>
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-2">
                <a th:href="@{/}" class="px-5 py-3 rounded-lg border border-stone-300 text-stone-700 font-semibold hover:bg-stone-100">Volver</a>
                <button type="submit" class="px-5 py-3 rounded-lg bg-amber-700 text-white font-semibold hover:bg-amber-800">Registrar tanda</button>
            </div>
        </form>
    </main>

    <!-- Región viva para anuncios de lectores de pantalla (add/remove de filas) -->
    <div id="liveInsumos" aria-live="polite" class="sr-only"></div>

    <!-- Plantilla de fila clonada por JS (sin deps externos) -->
    <template id="filaInsumo">
        <tr class="insumo-row border-b border-stone-100 last:border-0">
            <td class="py-3 pr-4">
                <select name="insumoIds" class="w-full text-lg px-3 py-2 rounded-lg border border-stone-300 focus:ring-2 focus:ring-amber-600" required>
                    <option value="" disabled>Seleccione insumo</option>
                    <option th:each="ins : ${insumos}" th:value="${ins.id}" th:text="${ins.nombre}"
                            data-existencia="${ins.getExistenciaActual()}"></option>
                </select>
                <span class="hint-existencia block mt-1 text-xs text-stone-500"></span>
            </td>
            <td class="py-3 pr-4">
                <input name="cantidades" type="number" step="0.001" min="0" inputmode="decimal" required
                       class="w-full text-lg px-3 py-2 rounded-lg border border-stone-300 focus:ring-2 focus:ring-amber-600">
            </td>
            <td class="py-3">
                <button type="button" class="remover text-rose-600 hover:text-rose-800 font-mono text-xl leading-none" aria-label="Quitar insumo de la fila">&times;</button>
            </td>
        </tr>
    </template>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script>
        (() => {
            const tpl = document.getElementById('filaInsumo');
            const body = document.getElementById('insumosBody');
            const addBtn = document.getElementById('addInsumo');
            const emptyMsg = document.getElementById('msgVacio');
            const live = document.getElementById('liveInsumos');
            const say = (msg) => { live.textContent = ''; live.textContent = msg; };

            const initRow = (row) => {
                const sel = row.querySelector('select[name="insumoIds"]');
                const hint = row.querySelector('.hint-existencia');
                const showHint = () => {
                    const opt = sel.options[sel.selectedIndex];
                    hint.textContent = opt.dataset.existencia != null ? `Existencia: ${opt.dataset.existencia} kg` : '';
                };
                sel.addEventListener('change', showHint);
                showHint();
                row.querySelector('.remover').addEventListener('click', () => {
                    row.remove();
                    syncEmpty();
                    say('Fila de insumo eliminada');
                });
            };

            const syncEmpty = () => {
                emptyMsg.hidden = body.querySelectorAll('tr.insumo-row').length > 0;
            };

            document.querySelectorAll('tr.insumo-row').forEach(initRow);
            syncEmpty();

            addBtn.addEventListener('click', () => {
                const row = tpl.content.cloneNode(true).firstElementChild;
                body.appendChild(row);
                initRow(row);
                syncEmpty();
                say('Fila de insumo agregada');
            });
        })();
    </script>
</body>
</html>
