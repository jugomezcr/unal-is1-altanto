# Configuración de la aplicación (equivale a un .env o settings.py de Python).
# Spring la lee al arrancar. Los valores también se pueden leer en Java con @Value("${clave}").

spring.application.name=altanto

# Base de datos H2 guardada en el archivo ./data/altanto.mv.db (sobrevive a reinicios).
# DB_CLOSE_ON_EXIT=FALSE: Spring cierra la base al apagar, no la JVM.
spring.datasource.url=jdbc:h2:file:./data/altanto;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Ejecutar schema.sql y data.sql en cada arranque (ambos son idempotentes).
spring.sql.init.mode=always
# Hibernate no crea ni cambia tablas: solo valida que las @Entity coincidan con schema.sql.
spring.jpa.hibernate.ddl-auto=validate

# Consola web para ver la base de datos: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
